<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Inbar — Plates</title>
<link rel="icon" href="assets/logo-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bp:#0f3c91; --bp-d:#0a2a6b; --ink:#eef4ff; --mute:#9db8ea; --paper:#f3efe4;
  --line:rgba(255,255,255,.10); --edge:rgba(255,255,255,.55);
  --o2:cubic-bezier(.25,.46,.45,.94); --o5:cubic-bezier(.23,1,.32,1); --o6:cubic-bezier(.19,1,.22,1); --i4:cubic-bezier(.895,.03,.685,.22);
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bp);color:var(--ink);font:400 16px/20px var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:#fff;color:var(--bp)}

/* blueprint paper: 20px minor / 100px major grid */
.bp-bg{
  background-color:var(--bp);
  background-image:
    linear-gradient(rgba(255,255,255,.17) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.17) 1px,transparent 1px),
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  background-position:-1px -1px;
}

/* ---------- card engine (Work) ---------- */
#cards{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none}
body[data-mode="out"] #cards{cursor:grab}
body.dragging #cards{cursor:grabbing}
.card,.tile{position:absolute;left:0;top:0;will-change:transform,width,height;outline:1px solid transparent;outline-offset:7px;transition:outline-color .5s}
.card{display:none}
body[data-mode="out"] .card{outline-color:var(--edge)}
.tile{outline-color:var(--edge);outline-offset:0}
.cm{position:absolute;inset:0;overflow:hidden;background:rgba(255,255,255,.08);isolation:isolate}
.cm img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;opacity:0;transition:opacity .6s var(--o2);will-change:transform;pointer-events:none;-webkit-user-drag:none}
.cm img.ld{opacity:1}
/* blueprint cyanotype tint, per photo */
.cm::after{content:"";position:absolute;inset:0;background:#2459cf;mix-blend-mode:multiply;opacity:.5;transition:opacity .6s var(--o2);pointer-events:none}
body.clean .cm::after{opacity:0}
.cap{position:absolute;left:0;right:0;top:calc(100% + 16px);display:flex;justify-content:space-between;gap:8px;white-space:nowrap;
  font:400 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mute);opacity:0;transition:opacity .5s;pointer-events:none}
body[data-mode="out"] .cap{opacity:1}
#intro{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}

/* blueprint grid drawn on the photo itself (hero only) */
.card .cm::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s var(--o2);
  background-image:
    linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
body[data-mode="in"]:not(.introing) .card .cm::before{opacity:.8}
body.clean[data-mode="in"]:not(.introing) .card .cm::before{opacity:.25}

/* sheet frame + rulers */
#frame{position:fixed;inset:16px;border:1px solid var(--edge);z-index:90;pointer-events:none}
#frame::before,#frame::after{content:"";position:absolute;pointer-events:none}
#frame::before{left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,var(--edge) 0 1px,transparent 1px 10px)}
#frame::after{top:0;bottom:0;left:0;width:7px;background:repeating-linear-gradient(0deg,var(--edge) 0 1px,transparent 1px 10px)}
#frame i{position:absolute;pointer-events:none}
#frame i.tx{left:0;right:0;top:0;height:13px;background:repeating-linear-gradient(90deg,var(--edge) 0 1px,transparent 1px 100px)}
#frame i.ty{top:0;bottom:0;left:0;width:13px;background:repeating-linear-gradient(0deg,var(--edge) 0 1px,transparent 1px 100px)}

/* crosshairs */
#cross{position:fixed;inset:0;z-index:10;pointer-events:none}
#cross button{position:absolute;top:calc(50% - 11px);width:22px;height:22px;pointer-events:all;opacity:0;transition:opacity .6s var(--o2)}
#cross svg{display:block;fill:#fff;transition:transform 1200ms var(--o6)}
#cx1{left:16.1979vw} #cx2{right:16.1979vw} #cx3{right:calc(50% - 11px);pointer-events:none!important;transition-delay:.3s!important}
#cx1 svg,#cx2 svg{transform:rotate(-90deg) scale(.4)}
body.s-cross[data-mode="in"] #cx1,body.s-cross[data-mode="in"] #cx2{opacity:1}
body.s-cross #cx1 svg,body.s-cross #cx2 svg{transform:rotate(var(--r,0deg))}
body[data-mode="out"] #cx3{opacity:1}
body:not(.s-cross) #cross button,body[data-mode="out"] #cx1,body[data-mode="out"] #cx2{pointer-events:none}

/* title */
#title-w{position:fixed;z-index:11;left:50%;top:calc(50% - 1.6vw);transform:translateX(-50%);pointer-events:none;overflow:hidden;display:grid;padding:.4em .6em;margin:-.4em -.6em}
#title-w .t{grid-area:1/1;display:flex;justify-content:center;align-items:flex-start;gap:.5em;white-space:nowrap;
  font-size:clamp(28px,3.125vw,60px);line-height:1.3;letter-spacing:-.015em;transition:transform 900ms var(--o5);pointer-events:all;cursor:pointer}
#title-w .t sup{font:400 11px/1 var(--mono);letter-spacing:0;margin-top:.55em;opacity:.8}
#title-w .t.t-in{transform:translateY(112%)} #title-w .t.t-out{transform:translateY(-112%);pointer-events:none}
body[data-mode="out"] #title-w .t{pointer-events:none}

/* nav (masked slide-up like the reference) */
#nav{position:fixed;z-index:95;top:37px;left:0;width:100%;display:flex;justify-content:center;pointer-events:none}
#nav div{margin:0 22px;white-space:nowrap;overflow:hidden}
.nav-a{display:block;opacity:.4;pointer-events:all;transform:translateY(110%);transition:opacity 300ms var(--o2),transform 1000ms var(--o5)}
body.ready .nav-a{transform:none}
.nav-a.on,.nav-a:hover{opacity:1}

/* pagination + thumbs */
#pgn{position:fixed;z-index:11;bottom:36px;left:50%;transform:translate(-50%,20px);opacity:0;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:.6em;transition:opacity .8s var(--o2),transform 1000ms var(--o5)}
/* rolling counter: current number slides up and is cropped, the next one rises in from below */
#pgn .pg-n{display:block;height:20px;overflow:hidden;text-align:right}
#pgn .pg-col{display:block;transition:transform 900ms var(--o5);will-change:transform}
#pgn .pg-col i{display:block;font-style:normal;height:20px;line-height:20px}
#pgn .pg-t{display:block;height:20px;line-height:20px}
body.ready #pgn{opacity:1;transform:translateX(-50%)}
#thumbs{position:fixed;z-index:11;right:40px;bottom:36px;width:min(340px,30vw);height:26px;overflow:hidden;transition:opacity .5s,transform .8s var(--o5);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
body[data-mode="out"] #thumbs{opacity:0;transform:translateY(70px);pointer-events:none}
#thumbs-in{display:flex;gap:6px;height:100%;transition:transform 800ms var(--o5);will-change:transform}
#thumbs-in button{flex:0 0 38px;height:100%;opacity:.45;outline:1px solid transparent;outline-offset:2px;overflow:hidden;
  transform:translateY(140px);transition:opacity .3s,outline-color .3s,transform 1500ms var(--o6)}
body.s-thumbs #thumbs-in button{transform:none}
#thumbs-in button img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.6)}
#thumbs-in button:hover{opacity:.85}
#thumbs-in button.on{opacity:1;outline-color:#fff}
@media (max-width:900px){#thumbs{display:none}}

@media (max-width:700px){#pgn{bottom:30px;left:auto;right:30px;transform:translateY(20px)}body.ready #pgn{transform:none}}

/* hide Work-UI in other views */
body:not([data-view="work"]) #cross,body:not([data-view="work"]) #title-w,body:not([data-view="work"]) #pgn,body:not([data-view="work"]) #thumbs{opacity:0;pointer-events:none}
body:not([data-view="work"]) #cross button,body:not([data-view="work"]) #title-w .t{pointer-events:none}
body:not([data-view="work"]) #cards{visibility:hidden;transition:visibility 0s .6s}
body[data-mode="out"] #pgn{opacity:1}

/* ---------- overlays ---------- */
/* scrolling pages live INSIDE the white frame (inset 16px), and text fades out before it reaches the top links */
.ov{position:fixed;inset:16px;z-index:50;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transition:opacity .6s var(--o2),visibility 0s .6s;scrollbar-width:none;
  background-attachment:fixed;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 46px,#000 92px,#000 calc(100% - 40px),transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,transparent 46px,#000 92px,#000 calc(100% - 40px),transparent 100%)}
.ov::-webkit-scrollbar{display:none}
body[data-view="sheet"] #sheet,body[data-view="about"] #about{opacity:1;visibility:visible;transition:opacity .6s var(--o2)}
#back{position:fixed;z-index:95;top:37px;left:40px;opacity:0;pointer-events:none;transition:opacity .4s}
body:not([data-view="work"]) #back{opacity:1;pointer-events:all}
#back:hover{opacity:.4}
#sn{position:fixed;z-index:95;top:37px;right:40px;font:400 14px/20px var(--mono);opacity:0;transition:opacity .4s;font-variant-numeric:tabular-nums}
body[data-view="sheet"] #sn{opacity:1}

/* sheet (project-style page) */
.s-head{padding:28vh 0 10vw;text-align:center}
.s-head h1{font-weight:400;font-size:clamp(28px,3.125vw,60px);line-height:1.3;letter-spacing:-.015em}
.s-head p{margin-top:14px;font:400 11px/1.6 var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.fig{position:relative;margin:0 auto 12vw;padding:34px 0 0 34px;opacity:0;transform:translateY(40px);transition:opacity 1s var(--o2),transform 1.2s var(--o6)}
.fig.in{opacity:1;transform:none}
.fig.land{width:min(52.9vw,900px)} .fig.port{width:min(36vw,620px)}
.fig .ph{position:relative;background:rgba(255,255,255,.08);outline:1px solid var(--edge);outline-offset:6px}
.fig .ph img{display:block;width:100%;height:100%;object-fit:cover}
.fig .ph::after{content:"";position:absolute;inset:0;background:#2459cf;mix-blend-mode:multiply;opacity:.28;transition:opacity .6s;pointer-events:none}
body.clean .fig .ph::after{opacity:0}
.fig figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font:400 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.dim-x,.dim-y{position:absolute;background:var(--edge)}
.dim-x{left:34px;right:0;top:13px;height:1px}
.dim-y{top:34px;left:13px;bottom:calc(1.3em + 18px);width:1px}
.dim-x::before,.dim-x::after{content:"";position:absolute;top:-5px;width:1px;height:11px;background:var(--edge)}
.dim-x::before{left:0}.dim-x::after{right:0}
.dim-y::before,.dim-y::after{content:"";position:absolute;left:-5px;height:1px;width:11px;background:var(--edge)}
.dim-y::before{top:0}.dim-y::after{bottom:0}
.dim-x b,.dim-y b{position:absolute;background:var(--bp);padding:0 8px;font:400 10px/14px var(--mono);letter-spacing:.06em;white-space:nowrap}
.dim-x b{left:50%;top:-7px;transform:translateX(-50%)}
.dim-y b{top:50%;left:-7px;writing-mode:vertical-rl;padding:8px 0;transform:translateY(-50%) rotate(180deg)}
.s-end{padding:4vw 0 18vh;text-align:center}
.s-end a{display:inline-block;transition:opacity .3s}.s-end a:hover{opacity:.4}
@media (max-width:700px){.fig.land,.fig.port{width:calc(100vw - 96px)}.fig{margin-bottom:22vw}}

/* about */
#about .wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:0 40px}
#about .l{padding:22vh 0 12vh}
#about .r{padding:22vh 0 14vh 0;font-size:clamp(16px,1.45vw,25px);line-height:1.55;letter-spacing:-.01em}
#about .r .nm{font-weight:500;font-size:clamp(30px,3.4vw,64px);line-height:1.1;letter-spacing:-.025em;margin-bottom:.8em}
#about .r p+p{margin-top:1.1em}
#about .r .ts{font-size:clamp(14px,1.25vw,22px);line-height:1.5;color:var(--mute);letter-spacing:-.01em}
#about .r .ts a{color:var(--ink);transition:opacity .3s}#about .r .ts a:hover{opacity:.5}
#about .r .contact{margin-top:2.2em;font-family:var(--mono);font-size:clamp(12px,.95vw,16px);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:.4em .9em;align-items:baseline}
#about .r .contact .lbl{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-right:.6em}
#about .r .contact .sep{color:var(--mute)}
/* Hebrew version: right-to-left, separated by a blueprint rule */
#about .r .he{margin-top:3.2em;padding-top:2.4em;border-top:1px solid var(--edge);font-family:"Heebo",var(--sans);letter-spacing:0}
#about .r .he p+p{margin-top:1.1em}
#about .logo{display:block;width:min(360px,100%);height:auto;margin:0 0 22px;pointer-events:none;-webkit-user-drag:none}
/* blueprint on/off switch (lives on the About page) */
#tog{display:inline-block;padding:11px 18px;border:1px solid var(--edge);font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;transition:background .25s,color .25s}
#tog:hover{background:var(--ink);color:var(--bp)}
@media (max-width:900px){#about .wrap{grid-template-columns:1fr;padding:0 28px}#about .l{padding:18vh 0 6vh}#about .r{padding:0 0 18vh}}

/* loader */
#loader{position:fixed;inset:0;z-index:200;display:grid;place-items:center}
#loader.go{background-image:none;background-color:transparent}
#loader.off{display:none}
#loader .lc{width:min(260px,60vw);background:var(--paper);color:#0b0b0b;padding:12px;box-shadow:0 0 0 1px #000,0 0 0 6px rgba(255,255,255,.18);transition:transform 1000ms var(--i4),opacity 1000ms var(--i4)}
#loader.go .lc{transform:translateY(-70vh);opacity:0}
#loader img{display:block;width:100%}
#loader .pc{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid #0b0b0b;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
#loader .bar{height:3px;background:rgba(0,0,0,.15);margin-top:8px}#loader .bar i{display:block;height:100%;width:0;background:#0b0b0b}
#empty{position:fixed;inset:0;z-index:12;display:none;place-items:center;text-align:center;font:400 12px/1.7 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
/* ---------- phones / touch ---------- */
*{-webkit-tap-highlight-color:transparent}
.ov{overscroll-behavior:contain}
#cross button::after{content:"";position:absolute;inset:-18px}            /* bigger tap area for the + marks */
/* Index button: phones have no scroll wheel, so this opens / closes the card row */
#idxbtn{position:fixed;z-index:95;left:34px;bottom:30px;display:none;padding:12px 6px;margin:-12px -6px;opacity:0;transition:opacity .8s var(--o2);font-size:16px;line-height:20px}
body.ready #idxbtn{opacity:1}
#idxbtn .b{display:none} body[data-mode="out"] #idxbtn .a{display:none} body[data-mode="out"] #idxbtn .b{display:inline}
body:not([data-view="work"]) #idxbtn{opacity:0;pointer-events:none}
@media (max-width:900px),(hover:none){#idxbtn{display:block}}
@media (max-width:700px){
  #nav,#back,#sn{top:30px}
  #nav div{margin:0 16px}
  #back{left:34px;padding:10px;margin:-10px}
  #sn{right:34px}
  #title-w .t sup{display:none}
  #cx1{left:6vw} #cx2{right:6vw}
  #tog{padding:15px 22px}
  .s-head{padding-top:22vh}
}
@media (max-height:560px){                                                /* landscape phone */
  #nav,#back,#sn{top:26px}
  .s-head{padding:18vh 0 14vh}
  #idxbtn{bottom:26px} #pgn{bottom:26px}
  #about .l{padding-top:16vh} #about .r{padding-top:16vh}
}
</style>
</head>
<body class="bp-bg introing" data-view="work" data-mode="in">

<div id="cards"></div>
<div id="intro"></div>

<div id="cross">
  <button id="cx1" aria-label="Previous plate"><svg viewBox="0 0 22 22"><path d="M10.5 0h1v22h-1zM0 10.5h22v1H0z"/></svg></button>
  <button id="cx3" tabindex="-1"><svg viewBox="0 0 22 22"><path d="M10.5 0h1v22h-1zM0 10.5h22v1H0z"/></svg></button>
  <button id="cx2" aria-label="Next plate"><svg viewBox="0 0 22 22"><path d="M10.5 0h1v22h-1zM0 10.5h22v1H0z"/></svg></button>
</div>
<div id="title-w"></div>
<div id="empty">No photos found.<br>Run sync.ps1 to pull the album.</div>

<nav id="nav">
  <div><a class="nav-a on" id="n-work" href="#">Work</a></div>
  <div><a class="nav-a" id="n-about" href="#about">About</a></div>
</nav>
<a id="back" href="#">Back</a>
<div id="sn"></div>
<div id="pgn"></div>
<button id="idxbtn" type="button" aria-label="Toggle plate index"><span class="a">Index</span><span class="b">Close</span></button>
<div id="thumbs"><div id="thumbs-in"></div></div>

<div id="frame"><i class="tx"></i><i class="ty"></i></div>

<section id="sheet" class="ov bp-bg" aria-label="All plates"></section>

<section id="about" class="ov bp-bg" aria-label="About">
  <div class="wrap">
    <div class="l">
      <img class="logo" src="assets/logo-black.png" alt="Inbar logo">
      <button id="tog" type="button">Blueprint ● on</button>
    </div>
    <div class="r" id="a-text"></div>
  </div>
</section>

<div id="loader" class="bp-bg">
  <div class="lc"><img src="assets/logo-black.png" alt=""><div class="pc"><span>Loading plates</span><span id="ld-n">0%</span></div><div class="bar"><i id="ld-b"></i></div></div>
</div>

<script>document.write('<script src="photos.js?d=' + Math.floor(Date.now() / 864e5) + '"><\/script>');</script>
<script>
/* ===== edit these ===== */
const SITE = {
  name: 'Inbar Viente',
  titlePrefix: 'Plate',          // slide title: "Plate 01"
  // About page — the name is shown large on top; all paragraphs share one size
  about: [
    'I’m Inbar Viente, and my background is in building things. I have a strong foundation in mathematics and physics, I program in C, and I work with Figma and Photoshop. In high school, I was the head integrator of my FIRST Robotics Competition (FRC) team, where I designed and built robot mechanisms.',
    'I do photography as a hobby. I shoot things that interest me: signs, street art, and the small, odd details that catch my eye.',
    'I’m currently serving in a technical role. The photographs on this site come straight from my personal album and are refreshed every day.'
  ],
  aboutHe: [
    'אני ענבר, ואני בונה דברים. יש לי רקע במתמטיקה ובפיזיקה, אני מתכנתת בשפת C ועובדת ב-Figma ו-Photoshop. בתיכון הייתי ראש צוות האינטגרציה בקבוצת ה-FRC שלי, שבה תכננתי ובניתי מכלולים לרובוט.',
    'אני מצלמת כתחביב. אני מצלמת דברים שמעניינים אותי: שלטים, אמנות רחוב ודברים קטנים ומוזרים שתופסים לי את העין.',
    'כיום אני משרתת בתפקיד טכני. התמונות באתר מגיעות ישירות מהאלבום שלי ומתעדכנות מדי יום.'
  ],
  email: 'inbar.viente@gmail.com',   // hidden when empty
  phone: '058-774-8788'              // hidden when empty
};
/* ====================== */

const A = window.ALBUM || {photos: [], updated: null};
const P = A.photos, N = P.length;
// new random order on every page load (Fisher–Yates) — the hero, card row, thumbs and Sheet all follow it
for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const imgUrl = (p, w) => p.url + '=w' + w;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const iLerp = (a, b, t) => clamp((t - a) / (b - a), 0, 1);
const loadedAt = Date.now(), SYNC_MS = 24 * 3600 * 1000;
const FAST = /[?&]fast/.test(location.search) || (matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const gcd = (a, b) => b ? gcd(b, a % b) : a;

}

/* =====================================================================
   sheet (project-style page) + about + routing
   ===================================================================== */
let sheetBuilt = false;
function buildSheet() {
  if (sheetBuilt) return; sheetBuilt = true;
  $('#sheet').innerHTML =
    `<div class="s-head"><h1>${SITE.titlePrefix}s</h1><p>${N} drawings · synced ${fmt(syncT)}</p></div>` +
    P.map((p, i) => {
      const port = p.h > p.w, g = gcd(p.w, p.h);
      return `<figure class="fig ${port ? 'port' : 'land'}" id="f${i}" data-i="${i}">
        <div class="dim-x"><b>${p.w} PX</b></div><div class="dim-y"><b>${p.h} PX</b></div>
        <div class="ph" style="aspect-ratio:${p.w}/${p.h}"><img loading="lazy" decoding="async" alt="${label(i)}" src="${imgUrl(p, SQ)}"></div>
        <figcaption><span>${label(i, true)}</span><span>${p.w}×${p.h}</span><span>${p.w / g}:${p.h / g}</span></figcaption></figure>`;
    }).join('') + `<div class="s-end"><a href="#">Back to Work</a></div>`;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), {root: $('#sheet'), threshold: .08});
  const io2 = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && view === 'sheet') { idx = +e.target.dataset.i; setPgn(idx); }
  }), {root: $('#sheet'), rootMargin: '-45% 0px -45% 0px'});
  $('#sheet').querySelectorAll('.fig').forEach(f => { io.observe(f); io2.observe(f); });
}
function route() {
  const h = location.hash, prev = view;
  view = h === '#sheet' ? 'sheet' : h === '#about' ? 'about' : 'work';
  body.dataset.view = view;
  $('#n-work').classList.toggle('on', view !== 'about');
  $('#n-about').classList.toggle('on', view === 'about');
  if (view === 'sheet') {
    buildSheet();
    const f = $('#f' + idx);
    if (f) { f.classList.add('in'); $('#sheet').scrollTop = idx === 0 ? 0 : f.offsetTop - ($('#sheet').clientHeight - f.offsetHeight) / 2; }
  } else if (view === 'work' && prev === 'sheet' && !intro) {
    if (mode === 'out') { mode = 'in'; body.dataset.mode = 'in'; }
    syncStage();
  }
}
addEventListener('hashchange', route);
$('#n-work').addEventListener('click', e => {
  if (view === 'work' && !intro) { e.preventDefault(); mode === 'in' ? toOut() : toIn(centerIdx()); }
});
$('#idxbtn').addEventListener('click', () => {
  if (view === 'work' && !intro) mode === 'in' ? toOut() : toIn(centerIdx());
});
$('#cx1').onclick = () => go(idx - 1);
$('#cx2').onclick = () => go(idx + 1);

/* ---------- input ---------- */
let wheelLock = 0;
addEventListener('wheel', e => {
  if (view !== 'work' || intro) return;
  const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (mode === 'in') {                                   // scrolling the hero opens the card row (as on the reference)
    const now = performance.now();
    if (now < wheelLock || now < lockUntil || Math.abs(d) < 8) return;
    wheelLock = now + 1200; toOut();
  } else scroll.tar = clamp(scroll.tar + d * 1.6, 0, maxScroll);
}, {passive: true});

addEventListener('keydown', e => {
  if (view === 'work' && !intro) {
    if (mode === 'in') {
      if (e.key === 'ArrowRight') go(idx + 1);
      else if (e.key === 'ArrowLeft') go(idx - 1);
      else if (['ArrowDown', 'ArrowUp', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); toOut(); }
      else if (e.key === 'Enter') location.hash = '#sheet';
    } else {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); scroll.tar = clamp((Math.round(scroll.tar / pitch) + 1) * pitch, 0, maxScroll); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); scroll.tar = clamp((Math.round(scroll.tar / pitch) - 1) * pitch, 0, maxScroll); }
      else if (e.key === 'Enter' || e.key === 'Escape') toIn(centerIdx());
    }
  } else if (e.key === 'Escape' && view !== 'work') location.hash = '';
  if (e.key === 'b' || e.key === 'B') $('#tog').click();
});

/* drag the card row (the SlidingImages mechanic: pointer delta -> track offset, images pan inside their frames) */
let drag = null;
cardsEl.addEventListener('pointerdown', e => {
  if (intro || view !== 'work' || e.button > 0) return;
  const card = e.target.closest && e.target.closest('.card');
  drag = {x: e.clientX, y: e.clientY, s: scroll.tar, moved: false, i: card ? +card.dataset.i : null};
  try { cardsEl.setPointerCapture(e.pointerId); } catch (_) {}
});
cardsEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 6) drag.moved = true;
  if (mode === 'out' && drag.moved) { body.classList.add('dragging'); scroll.tar = clamp(drag.s - dx * 1.8, 0, maxScroll); }
});
const endDrag = (e, cancel) => {
  if (!drag) return; const d = drag; drag = null; body.classList.remove('dragging');
  if (cancel) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (!d.moved) {
    if (mode === 'out') { if (d.i != null) toIn(d.i); }
    else go(e.clientX > win.w / 2 ? idx + 1 : idx - 1);
  } else if (mode === 'in') {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
    else if (Math.abs(dy) > 50) toOut();
  }
};
cardsEl.addEventListener('pointerup', e => endDrag(e, false));
cardsEl.addEventListener('pointercancel', e => endDrag(e, true));

$('#tog').onclick = () => {
  const c = body.classList.toggle('clean');
  $('#tog').textContent = 'Blueprint ● ' + (c ? 'off' : 'on');
  try { localStorage.setItem('bp-clean', c ? '1' : '0'); } catch (_) {}
};
try { if (localStorage.getItem('bp-clean') === '1') $('#tog').click(); } catch (_) {}

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { calc(); if (!intro) { scroll.tar = scroll.cur = clamp(scroll.cur, 0, maxScroll); snapAll(false); } }, 120); });

/* the album is re-pulled server-side every 24h (serve.ps1 / scheduled sync);
   reload when the tab comes back after a day so it picks up the fresh photos.js */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - loadedAt > SYNC_MS) location.reload();
});

/* ---------- start ---------- */
if (!N) {
  $('#empty').style.display = 'grid'; $('#loader').classList.add('off'); intro = false;
  body.classList.remove('introing'); body.classList.add('ready', 's-cross', 's-thumbs');
} else {
  snapAll(true);                 // hero plate waits (hidden) until the intro hands over to it
  buildTiles(); updateUI();
  requestAnimationFrame(frame);
  checkReady();
}
route();
</script>
</body>
</html>
