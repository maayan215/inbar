name: sync-album

# Re-pulls the Google Photos album once a day and commits photos.js, which redeploys the site.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-album
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull album
        shell: pwsh
        env:
          ALBUM_URL: ${{ secrets.ALBUM_URL }}
        run: ./sync.ps1
      - name: Commit if changed
        run: |
          git config user.name "album-sync"
          git config user.email "actions@users.noreply.github.com"
          git add photos.js
          git diff --cached --quiet || (git commit -m "Sync album" && git push)
